name: Package integrations for Autohive
run-name: Package integrations (${{ github.sha }})

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      integrations:
        description: Comma/newline-separated integration paths, or "all"
        required: true
        default: all
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: package-integrations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-and-release:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out integrations
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out HiveUp tooling
        uses: actions/checkout@v4
        with:
          repository: Autohive-AI/autohive-integrations-tooling
          ref: 2.5.0
          path: .hiveup-tooling
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .hiveup-tooling/pyproject.toml

      - name: Install HiveUp
        run: python -m pip install ./.hiveup-tooling

      - name: Verify release selection
        run: python -m unittest discover -s .github/tests -v

      - name: Resolve release contents
        id: selection
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          MANUAL_SELECTION: ${{ inputs.integrations }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            # Use the last published integration package release as the durable
            # baseline. Workflow run history is capped by GitHub search windows,
            # so deriving the baseline from Actions history can silently miss
            # unreleased version bumps after a long or busy period.
            previous_commit_sha=""
            gh api \
              --paginate \
              "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '.[] | select(.draft | not) | [.tag_name, .target_commitish, ((.body // "") | split("\n")[0])] | @tsv' > "$RUNNER_TEMP/integration-releases.txt"
            while IFS=$'\t' read -r release_tag release_target release_summary; do
              if [[ "$release_tag" != integration-packages-* || -z "$release_target" ]]; then
                continue
              fi
              if [[ "$release_summary" != "Integration incremental packages"* && "$release_summary" != "Integration bootstrap packages"* ]]; then
                continue
              fi
              if ! release_sha="$(git rev-parse --verify --quiet "${release_target}^{commit}")"; then
                echo "Release $release_tag points at $release_target, which is not present in the checkout history." >&2
                exit 1
              fi
              if [[ "$release_sha" != "$GITHUB_SHA" ]] && git merge-base --is-ancestor "$release_sha" "$GITHUB_SHA"; then
                previous_commit_sha="$release_sha"
                break
              fi
            done < "$RUNNER_TEMP/integration-releases.txt"
            if [[ -z "$previous_commit_sha" ]]; then
              echo "No prior integration bootstrap or incremental release was found." >&2
              echo "Run this workflow manually with integrations=all once to create the bootstrap release before incremental push releases." >&2
              exit 1
            fi
            release_kind="incremental"
            release_baseline_kind="incremental"
            hiveup release-changes \
              --repository-root . \
              --config .github/autohive-release.json \
              --base-ref "$previous_commit_sha" > "$RUNNER_TEMP/integration-paths.txt"
          else
            previous_commit_sha="$(git rev-parse "$GITHUB_SHA^")"
            release_kind="snapshot"
            release_baseline_kind="snapshot"
            normalized_selection="$(printf '%s' "$MANUAL_SELECTION" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
            if [[ "$normalized_selection" == "all" ]]; then
              release_baseline_kind="bootstrap"
            fi
            hiveup release-plan \
              --repository-root . \
              --config .github/autohive-release.json \
              --selection "$MANUAL_SELECTION" > "$RUNNER_TEMP/integration-paths.txt"
          fi

          if [[ ! -s "$RUNNER_TEMP/integration-paths.txt" ]]; then
            echo "No integration version bumps were found; no release is required."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          release_selection="$(paste -sd, "$RUNNER_TEMP/integration-paths.txt")"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "release_selection=$release_selection" >> "$GITHUB_OUTPUT"
          echo "previous_commit_sha=$previous_commit_sha" >> "$GITHUB_OUTPUT"
          echo "release_kind=$release_kind" >> "$GITHUB_OUTPUT"
          echo "release_baseline_kind=$release_baseline_kind" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/integration-paths.txt"

      - name: Package integrations
        if: steps.selection.outputs.has_changes == 'true'
        run: |
          set -euo pipefail
          mkdir -p dist
          # Pull requests have their own validation workflow. Release packaging must remain
          # available for already-merged integrations even if validation rules later tighten.
          # Each package resolves requirements into fresh staging; dependency pins still apply.
          xargs --max-procs 4 --no-run-if-empty -I {} \
            hiveup package "{}" --output "dist/{}.zip" --skip-validate \
            < "$RUNNER_TEMP/integration-paths.txt"

      - name: Create integrity manifest
        if: steps.selection.outputs.has_changes == 'true'
        env:
          RELEASE_SELECTION: ${{ steps.selection.outputs.release_selection }}
          PREVIOUS_COMMIT_SHA: ${{ steps.selection.outputs.previous_commit_sha }}
          RELEASE_KIND: ${{ steps.selection.outputs.release_kind }}
          RELEASE_BASELINE_KIND: ${{ steps.selection.outputs.release_baseline_kind }}
        run: |
          set -euo pipefail
          hiveup release-manifest \
            --repository-root . \
            --config .github/autohive-release.json \
            --selection "$RELEASE_SELECTION" \
            --artifacts dist \
            --output dist/autohive-manifest.json \
            --owner "$GITHUB_REPOSITORY_OWNER" \
            --repository "${GITHUB_REPOSITORY#*/}" \
            --commit-sha "$GITHUB_SHA" \
            --previous-commit-sha "$PREVIOUS_COMMIT_SHA" \
            --release-kind "$RELEASE_KIND" \
            --workflow-run-id "$GITHUB_RUN_ID"

      - name: Publish GitHub Release
        if: steps.selection.outputs.has_changes == 'true'
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_KIND: ${{ steps.selection.outputs.release_kind }}
          RELEASE_BASELINE_KIND: ${{ steps.selection.outputs.release_baseline_kind }}
          RELEASE_AUTHOR: ${{ github.event.head_commit.author.name || github.actor }}
        run: |
          set -euo pipefail
          tag="integration-packages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          short_sha="${GITHUB_SHA::12}"
          integration_names=$(python - <<'PY'
          import json
          import os
          from pathlib import Path

          names = []
          integration_paths = Path(os.environ["RUNNER_TEMP"]) / "integration-paths.txt"
          for line in integration_paths.read_text().splitlines():
              integration_path = line.strip()
              if not integration_path:
                  continue
              config_path = Path(integration_path) / "config.json"
              config = json.loads(config_path.read_text())
              names.append(config.get("display_name") or config.get("name") or integration_path)
          print(", ".join(names))
          PY
          )
          release_title="Integration releases - ${RELEASE_AUTHOR:-$GITHUB_ACTOR} - ${integration_names} - ${short_sha}"
          assets=("dist/autohive-manifest.json")
          while IFS= read -r integration_path; do
            assets+=("dist/$integration_path.zip")
          done < "$RUNNER_TEMP/integration-paths.txt"
          gh release create "$tag" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$release_title" \
            --notes "Integration ${RELEASE_BASELINE_KIND:-$RELEASE_KIND} packages built from ${GITHUB_SHA}. Autohive Admin reviews bindings and deploys these ZIPs; publication uses the existing integration publishing flow."
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "### Published [$tag]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$tag)" >> "$GITHUB_STEP_SUMMARY"

      - name: Record release tag
        if: steps.selection.outputs.has_changes == 'true'
        run: echo "Release tag is ${{ steps.release.outputs.tag }}"
