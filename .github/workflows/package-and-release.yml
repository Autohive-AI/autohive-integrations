name: Package integrations for Autohive
run-name: Package integrations (${{ inputs.request_id || github.run_id }})

on:
  workflow_dispatch:
    inputs:
      integrations:
        description: Comma/newline-separated integration paths or source IDs, or "all"
        required: true
        default: all
        type: string
      request_id:
        description: Optional Autohive correlation ID used for status polling
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: package-integrations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-and-release:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out integrations
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Check out HiveUp tooling
        uses: actions/checkout@v4
        with:
          repository: Autohive-AI/autohive-integrations-tooling
          ref: 2.5.0
          path: .hiveup-tooling
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .hiveup-tooling/pyproject.toml

      - name: Install HiveUp
        run: python -m pip install ./.hiveup-tooling

      - name: Resolve selection
        env:
          RELEASE_SELECTION: ${{ inputs.integrations }}
        run: |
          set -euo pipefail
          hiveup release-plan \
            --repository-root . \
            --config .github/autohive-release.json \
            --selection "$RELEASE_SELECTION" > "$RUNNER_TEMP/integration-paths.txt"
          test -s "$RUNNER_TEMP/integration-paths.txt"
          cat "$RUNNER_TEMP/integration-paths.txt"

      - name: Package integrations
        run: |
          set -euo pipefail
          mkdir -p dist
          # Pull requests have their own validation workflow. Release packaging must remain
          # reproducible for already-merged integrations even if validation rules later tighten.
          # release-plan only emits strict, whitespace-free top-level paths, so xargs does not
          # interpret user-provided shell syntax here.
          xargs --max-procs 4 --no-run-if-empty -I {} \
            hiveup package "{}" --output "dist/{}.zip" --skip-validate \
            < "$RUNNER_TEMP/integration-paths.txt"

      - name: Create integrity manifest
        env:
          RELEASE_SELECTION: ${{ inputs.integrations }}
        run: |
          set -euo pipefail
          hiveup release-manifest \
            --repository-root . \
            --config .github/autohive-release.json \
            --selection "$RELEASE_SELECTION" \
            --artifacts dist \
            --output dist/autohive-manifest.json \
            --owner "$GITHUB_REPOSITORY_OWNER" \
            --repository "${GITHUB_REPOSITORY#*/}" \
            --commit-sha "$GITHUB_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID"

      - name: Publish GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="integration-packages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          assets=("dist/autohive-manifest.json")
          while IFS= read -r integration_path; do
            assets+=("dist/$integration_path.zip")
          done < "$RUNNER_TEMP/integration-paths.txt"
          gh release create "$tag" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Integration packages ${GITHUB_SHA::12}" \
            --notes "Generated by workflow run ${GITHUB_RUN_ID} from commit ${GITHUB_SHA}. Deploy remains gated in the Autohive Admin UI; this release does not publish integrations to users."
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "### Published [$tag]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$tag)" >> "$GITHUB_STEP_SUMMARY"

      - name: Record release tag
        run: echo "Release tag is ${{ steps.release.outputs.tag }}"
