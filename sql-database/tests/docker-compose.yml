# Disposable databases for test_sql_database_integration.py. The password is for
# local test containers only. SQL Server runs under emulation on Apple Silicon.
#
#   docker compose -f sql-database/tests/docker-compose.yml up -d
#
# Then set the SQL_DATABASE_TEST_* variables shown in .env.example.
name: sql-database-tests

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Local-Test-Only-1"
    ports:
      - "127.0.0.1:51433:1433"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: "Local-Test-Only-1"
      POSTGRES_DB: sqltest
    ports:
      - "127.0.0.1:55432:5432"

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: "Local-Test-Only-1"
      MYSQL_DATABASE: sqltest
    ports:
      - "127.0.0.1:53306:3306"

  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: "Local-Test-Only-1"
      MARIADB_DATABASE: sqltest
    ports:
      - "127.0.0.1:53307:3306"
